
# Workflow [No indentation required for naming the workflow]
name: Hello

# On tells when the workflow should run (Give indentation by ta
on:
  workflow_dispatch:

# Job tells what the workflow should do, there can be one or mo
# jobs is an object so needs indentation

jobs:
  # 1st Job (give indentation)
  say-hello:
    # Creates an Ephemeral Container with Ubuntu running
    runs-on: ubuntu-latest
    # That ephemeral container will have steps to execute, hence
    steps:
      - name: Say hello to everyone
        run: echo "Hello Dosto"
